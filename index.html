<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixie Planner — Disney Dining Reservation Alerts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #2d1b69 0%, #6b3fa0 50%, #c779d0 100%);
      min-height: 100vh;
      padding: 24px 16px;
      color: #1a1a2e;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .sparkle {
      font-size: 32px;
      display: block;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #6b3fa0, #c779d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .tagline {
      color: #555;
      font-size: 15px;
      line-height: 1.4;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      letter-spacing: 0.2px;
    }

    label .optional {
      font-weight: 400;
      color: #888;
      font-size: 12px;
    }

    input, select {
      padding: 11px 12px;
      border: 1.5px solid #e0e0e8;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #6b3fa0;
      box-shadow: 0 0 0 3px rgba(107,63,160,0.15);
    }

    button {
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, #6b3fa0, #c779d0);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(107,63,160,0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      line-height: 1.45;
    }

    .message.success {
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
    }

    .message.error {
      background: #ffebee;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="sparkle">✨</span>
      <h1>Pixie Planner</h1>
      <p class="tagline">Get an email the moment your Disney dining reservation opens up.</p>
    </div>

    <form id="watch-form">
      <div class="field">
        <label for="email">Your Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="restaurant">Restaurant</label>
        <select id="restaurant" required>
          <option value="">— Choose a restaurant —</option>
          <optgroup label="Magic Kingdom">
            <option>Cinderella's Royal Table</option>
            <option>Be Our Guest Restaurant</option>
            <option>Crystal Palace</option>
            <option>Liberty Tree Tavern</option>
            <option>The Plaza Restaurant</option>
            <option>Tony's Town Square</option>
            <option>Skipper Canteen</option>
          </optgroup>
          <optgroup label="EPCOT">
            <option>Space 220 Restaurant</option>
            <option>Le Cellier Steakhouse</option>
            <option>Garden Grill Restaurant</option>
            <option>Akershus Royal Banquet Hall</option>
            <option>Monsieur Paul</option>
            <option>Takumi-Tei</option>
            <option>Teppan Edo</option>
            <option>Via Napoli</option>
          </optgroup>
          <optgroup label="Hollywood Studios">
            <option>Hollywood &amp; Vine</option>
            <option>50's Prime Time Café</option>
            <option>Sci-Fi Dine-In Theater</option>
            <option>Hollywood Brown Derby</option>
            <option>Oga's Cantina</option>
          </optgroup>
          <optgroup label="Animal Kingdom">
            <option>Tusker House Restaurant</option>
            <option>Tiffins</option>
            <option>Yak &amp; Yeti Restaurant</option>
          </optgroup>
          <optgroup label="Resort Hotels">
            <option>'Ohana (Polynesian)</option>
            <option>Chef Mickey's (Contemporary)</option>
            <option>California Grill (Contemporary)</option>
            <option>Topolino's Terrace (Riviera)</option>
            <option>Storybook Dining at Artist Point (Wilderness Lodge)</option>
            <option>1900 Park Fare (Grand Floridian)</option>
            <option>Citricos (Grand Floridian)</option>
            <option>Narcoossee's (Grand Floridian)</option>
            <option>Boma (Animal Kingdom Lodge)</option>
            <option>Sanaa (Animal Kingdom Lodge)</option>
            <option>Beaches &amp; Cream (Beach Club)</option>
            <option>Yachtsman Steakhouse (Yacht Club)</option>
            <option>Trattoria al Forno (BoardWalk)</option>
            <option>Hoop-Dee-Doo Musical Revue (Fort Wilderness)</option>
          </optgroup>
          <optgroup label="Disneyland (CA)">
            <option>Blue Bayou</option>
            <option>Carthay Circle Restaurant</option>
            <option>Lamplight Lounge</option>
            <option>Napa Rose</option>
            <option>Café Orleans</option>
            <option>Goofy's Kitchen</option>
            <option>Storytellers Café</option>
          </optgroup>
          <optgroup label="Other">
            <option>Other (we'll contact you)</option>
          </optgroup>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="desired_date">Date</label>
          <input type="date" id="desired_date" required />
        </div>
        <div class="field">
          <label for="party_size">Party Size</label>
          <input type="number" id="party_size" min="1" max="20" value="2" required />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="time_window_start">Earliest Time <span class="optional">(optional)</span></label>
          <input type="time" id="time_window_start" />
        </div>
        <div class="field">
          <label for="time_window_end">Latest Time <span class="optional">(optional)</span></label>
          <input type="time" id="time_window_end" />
        </div>
      </div>

      <button type="submit" id="submit-btn">Set Up Alert ✨</button>
    </form>

    <div id="message"></div>

    <p class="footer-note">
      We'll email you the moment a matching reservation opens up. Free to try — leave time fields blank for any time.
    </p>
  </div>

  <script>
    const SUPABASE_URL = 'https://qyktqlddzuziphhcvaco.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5a3RxbGRkenV6aXBoaGN2YWNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjY4MjYsImV4cCI6MjA5NDEwMjgyNn0.ef68HcCk4oN6m7pajODPAcvgw9w-Xs_vKJAZ3iozQp0';

    const form = document.getElementById('watch-form');
    const btn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Setting up alert...';

      const payload = {
        email: document.getElementById('email').value.trim(),
        restaurant: document.getElementById('restaurant').value,
        desired_date: document.getElementById('desired_date').value,
        party_size: parseInt(document.getElementById('party_size').value, 10),
        time_window_start: document.getElementById('time_window_start').value || null,
        time_window_end: document.getElementById('time_window_end').value || null,
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/watches`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal',
          },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          messageEl.className = '';
          messageEl.innerHTML = '<div class="message success">✨ Alert set! We\'ll email you the moment a table opens up.</div>';
          form.reset();
          document.getElementById('party_size').value = 2;
        } else {
          const errText = await res.text();
          messageEl.innerHTML = `<div class="message error">Something went wrong: ${errText}</div>`;
        }
      } catch (err) {
        messageEl.innerHTML = `<div class="message error">Network error: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Set Up Alert ✨';
      }
    });
  </script>
</body>
</html>
